map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /workspace/ros-humble/isaac_3d_lidar_amr_ws/maps/2d/warehouse_v3.yaml

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    tf_broadcast: true
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.10
    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 2
    laser_model_type: likelihood_field_prob
    laser_min_range: 0.5
    laser_max_range: 20.0
    max_beams: 180
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.20
    z_hit: 0.80
    z_rand: 0.20
    z_max: 0.0
    z_short: 0.0
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    min_particles: 800
    max_particles: 3000
    pf_err: 0.03
    pf_z: 0.99
    transform_tolerance: 0.5
