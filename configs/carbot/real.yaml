schema_version: 1
runtime: real
use_sim_time: false
clock_source: system
odom_source: fast_lio_base_adapter
pointcloud_message_type: livox_ros_driver2/msg/CustomMsg
# start_auto_nav.sh: the automatic localization manager seeds AMCL; an RViz
# /initialpose stays available as the operator fallback.
localization_default: automatic_amcl
initial_pose_default: automatic_startup_localization
allow_ground_truth_map_to_odom: false
allow_chassis_odom_relay: false
required_external_interfaces:
  - /livox/lidar
  - /mid360/imu/data_raw
  - /wheel_ticks
  - /odom
  - /scan
  - odom->base_footprint
# The files the Jetson navigation launch (carbot_navigation_real.launch.py) loads.
nav2_params_file: /workspace/ros-humble/isaac_3d_lidar_amr_ws/src/isaac_3d_lidar_bringup/config/nav2/carbot_navigation_real.yaml
amcl_params_file: /workspace/ros-humble/isaac_3d_lidar_amr_ws/src/isaac_3d_lidar_bringup/config/nav2/carbot_amcl_real.yaml
map_to_odom_owner: amcl
velocity_limits:
  linear_mps: 0.10
  angular_rad_s: 0.50
acceleration_limits:
  linear_mps2: 0.20
  angular_rad_s2: 2.00
physical_response:
  source: src/carbot_description/config/carbot_parameters.yaml#hardware_response
  minimum_reliable_angular_rad_s: 0.40
  rpp_max_angular_acceleration_rad_s2: 10.0
  smoother_angular_acceleration_rad_s2: 2.0
