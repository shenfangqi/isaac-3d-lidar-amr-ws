schema_version: 1

# Runtime interface names only. Physical geometry remains authoritative in
# src/carbot_description/config/carbot_parameters.yaml.
canonical_robot_parameters: /workspace/ros-humble/isaac_3d_lidar_amr_ws/src/carbot_description/config/carbot_parameters.yaml

frames:
  map: map
  odom: odom
  robot_base: base_footprint
  body: base_link
  lidar: front_3d_lidar

topics:
  pointcloud: /livox/lidar
  padded_pointcloud: /livox/lidar_nvblox
  scan: /scan
  global_scan_static_filtered: /scan_global_static_filtered
  global_scan: /scan_global_filtered
  odom: /odom
  cmd_vel: /cmd_vel
  cmd_vel_command: /cmd_vel_command
  wheel_ticks: /wheel_ticks
  overhead_clearance_markers: /overhead_clearance_markers

maps:
  nav2_yaml: /workspace/ros-humble/isaac_3d_lidar_amr_ws/maps/2d/warehouse_v3.yaml
  nvblox: /workspace/ros-humble/isaac_3d_lidar_amr_ws/maps/nvblox/warehouse_v3.nvblx

scan_projection:
  min_height_m: 0.10
  # Treat returns through the minimum safe overhead clearance as obstacles.
  # The 0.35 m ceiling leaves 0.11 m above the 0.24 m Carbot.
  max_height_m: 0.35
  min_range_m: 0.50
  max_range_m: 20.0
  angle_min_rad: -3.14
  angle_max_rad: 3.14
  angle_increment_rad: 0.0174

# Simulation-only physical fixtures. Isaac Sim creates the collision geometry,
# while the ROS marker publisher reads the same records for RViz display.
simulation_overhead_obstacles:
  - name: pass
    map_x_m: 2.0
    map_y_m: 0.0
    clearance_m: 0.40
    size_x_m: 0.40
    size_y_m: 1.00
    thickness_m: 0.10
    color_rgb: [0.10, 0.80, 0.25]
  - name: blocked
    map_x_m: -2.0
    map_y_m: 0.0
    clearance_m: 0.28
    size_x_m: 0.40
    size_y_m: 1.00
    thickness_m: 0.10
    color_rgb: [0.95, 0.20, 0.05]
