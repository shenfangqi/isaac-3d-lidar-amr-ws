schema_version: 1
status: BLOCKING_SIM_TO_REAL_CALIBRATION
policy_release_blocked: true
updated: 2026-09-16

items:
  - id: jetson_wheel_ticks_decode
    state: physical_verified
    blocking_calibration: false
    evidence_required: Decode live carbot_msgs WheelTicks at 50 Hz on Jetson/workstation.
    evidence_observed: Live decode at approximately 50 Hz; 15 s lifted static trial had zero tick drift and stable boot_id 549633487.
  - id: jetson_odometry_owner
    state: physical_verified
    blocking_calibration: false
    evidence_required: Verify exactly one /wheel_ticks -> /odom and odom -> base_footprint owner.
    evidence_observed: Enabled Jetson user service carbot-wheel-odometry.service; workstation observed exactly one /odom publisher and the odom -> base_footprint TF.
  - id: effective_radius
    state: baseline_confirmed
    blocking_calibration: false
    baseline_value_m: 0.02175
    release_verification: pending
    verification_progress: short_baseline_ground_repeats_complete
    evidence_required: Confirm the accepted baseline with forward and reverse measured 1 m trials; use the result as acceptance evidence, not as a missing calibration gate.
    evidence_observed: On wood flooring with zero added payload, two 0.05 m/s forward trials gave -0.61% and -1.30% apparent longitudinal slip; two reverse trials gave -2.06% and -0.36%. The four-trial effective-radius mean is 0.021985 m versus the 0.02175 m baseline. Keep the baseline until longer measured trials confirm the approximately +1.08% candidate correction.
  - id: effective_track_separation
    state: baseline_confirmed
    blocking_calibration: false
    baseline_value_m: 0.254
    release_verification: pending
    verification_progress: left_right_90deg_ground_partial
    evidence_required: Confirm the accepted baseline with left/right 90 and 360 degree trials; use the result as acceptance evidence, not as a missing calibration gate.
    evidence_observed: On wood flooring, a two-segment left turn produced 83.963 encoder degrees versus approximately 86 measured degrees, giving 0.247985 m effective track. A two-segment right turn produced 91.690 encoder degrees versus approximately 92 measured degrees, giving 0.253144 m. Their mean is 0.250564 m; retain the 0.254 m baseline pending precise-angle and 360-degree repeats.
  - id: track_slip_surface_variation
    state: partial_physical_evidence
    blocking_calibration: true
    evidence_required: Measure longitudinal and turning slip on representative floors and under representative payloads.
    evidence_observed: On wood flooring with zero added payload, two forward trials measured -0.61% and -1.30% apparent longitudinal slip and two reverse trials measured -2.06% and -0.36%. Both asymmetric repeats matched the observed yaw direction. Left/right approximately 90-degree composite turns gave yaw gains 1.0243 and 1.0034 respectively. Longer repeats, 360-degree turns, other surfaces, and payload variation remain pending.
  - id: actuator_latency_deadband_braking
    state: partial_physical_evidence
    blocking_calibration: true
    evidence_required: Timestamped command/RPM/PWM/voltage step and stop trials.
    evidence_observed: Lifted watchdog and directional deadband bags/ESP32 telemetry captured; forward M3/left track failed to sustain motion at 0.01-0.03 m/s and became stable at 0.05 m/s, while reverse became sustainable near 0.02 m/s. Ground stop tails varied from about 0.57 s to 0.92 s. A combined 12 s command at +0.20 rad/s integrated to 137.51 degrees but physically produced about 86 degrees, showing approximately 62.5% low-speed angular command tracking. Repeat braking and controller tuning remain pending.
  - id: mass_com_inertia
    state: pending
    blocking_calibration: true
    evidence_required: Measured mass, support-point center of mass, and CAD or pendulum inertia estimate.
  - id: track_friction
    state: pending
    blocking_calibration: true
    evidence_required: Controlled pull or incline tests including longitudinal/lateral slip.
  - id: imu_extrinsics_and_time
    state: blocked_by_firmware_unit_error
    blocking_calibration: true
    evidence_required: Measured imu_link transform and synchronized IMU/wheel timestamps.
    evidence_observed: >-
      time_synchronized=true, but 447 stationary samples had median acceleration
      norm 96.590896 m/s^2; firmware currently applies gravity conversion twice.
      Dynamic gyro is also invalid: during externally measured approximately
      86-degree left and 92-degree right turns, bias-corrected integration of every
      angular-velocity axis remained near zero and gyro.z peaked at only about
      0.004 rad/s. Diagnose sensor refresh/scale and reflash before any IMU fusion.
  - id: mid360_origin_and_extrinsics
    state: pending
    blocking_calibration: true
    evidence_required: Verify Livox origin O, especially Z, and base_link transform on final assembly.
  - id: command_watchdog_and_estop
    state: watchdog_and_temporary_manual_cutoff_verified
    blocking_calibration: true
    evidence_required: Physical 500 ms timeout and independent emergency-stop tests.
    evidence_observed: With tracks lifted, first motion occurred about 73 ms after a one-shot 0.05 m/s command and the final tick change occurred about 586 ms after command publication; tracks then remained stopped and explicit zero commands were sent. The vehicle has no standard physical e-stop. During a continuous 0.05 m/s ROS command, the phone web UI red stop did not produce an encoder-observed intermediate stop and motion_blocked remained false. A later trial manually cut ESP32 power about 1.3 s after motion began; ROS telemetry stopped and the operator visually confirmed the tracks stopped. Repowering did not move the tracks; ROS returned with new boot_id 2491872445, active_command_source 0, and zero ticks. This cutoff is accepted only for supervised low-speed calibration with a dedicated operator able to reach it immediately. Final autonomous-navigation acceptance still requires a standard stop that directly interrupts drive power or hardware enable.
  - id: observation_parity
    state: transport_instability_observed
    blocking_calibration: true
    evidence_required: Compare real observation units, rate, latency, dropout and normalization with training.
    evidence_observed: Wheel and IMU topics average about 50 Hz but live samples include duplicate/skipped sequences and intermittent discovery; reconnect_count increased from 18 to 103 during the lifted session. Diagnose Wi-Fi/micro-ROS transport before observation-parity acceptance.
  - id: real_navigation_acceptance
    state: pending
    blocking_calibration: true
    evidence_required: Manual AMCL initialization and guarded 0.10 m/s short-goal validation.

rules:
  - Never replace a pending state with a simulation-only result.
  - Confirmed effective radius and track-separation baselines require real-vehicle acceptance evidence but are not missing-calibration blockers.
  - Feed measured ranges back to the canonical parameter source and domain randomization.
  - Do not tune Nav2 to conceal odometry, TF, actuator, or sensor-calibration errors.
  - Do not freeze or deploy a policy while policy_release_blocked is true.
