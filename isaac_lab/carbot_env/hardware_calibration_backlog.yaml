  - id: imu_extrinsics_and_time
    state: mid360_ptp_verified_esp32_periodic_resync_and_extrinsics_pending
    blocking_calibration: true
    evidence_required: Measured imu_link transform and synchronized IMU/wheel timestamps.
    evidence_observed: >-
      Firmware commit 068071e removed the duplicate acceleration and gyro unit
      conversions. After reflashing, stationary acceleration norm had median
      9.803739 m/s^2. During an externally measured approximately 80-degree left
      turn, motion-preceding bias-corrected gyro.z integrated to 80.41 degrees and
      peaked at 0.2205 rad/s. A second externally measured 95-degree left turn
      integrated to 95.63 degrees. The respective 0.51% and 0.66% differences
      confirm the corrected dynamic scale and units. Two right-turn repeats showed
      104.11 versus approximately 110 external degrees and 69.09 versus
      approximately 65 external degrees; wheel-derived angles were 105.17 and
      69.87 degrees, closely matching the IMU but exposing large open-loop turning
      variability. Closed-loop full turns then gave 356.29 IMU versus approximately
      353 external degrees on the left and 358.10 IMU versus 363 external degrees on
      the right. Dynamic firmware validation is complete; final MID-360
      extrinsic/time validation remained required before enabling IMU fusion. On
      2026-09-18 the MID-360 at 192.168.2.202 streamed approximately 10 Hz point
      clouds and 200 Hz IMU data to Jetson 192.168.2.100 with no Ethernet errors.
      The Livox driver forwards acceleration in g despite using sensor_msgs/Imu;
      a tested adapter now publishes SI acceleration on /mid360/imu/data_raw and
      marks orientation unavailable. A stationary 1849-sample capture had mean
      acceleration (0.00964, -0.00944, 0.99177) g and monotonic approximately 5 ms
      ROS header intervals. A separate 1000-sample check found mean host receive
      minus header latency around 0.81 ms, but source inspection confirmed that
      unsynchronized Livox packets are re-stamped with host time. No ptp4l or
      phc2sys process is active and the Jetson LiDAR NIC has no hardware PTP
      clock, although the NIC does advertise software TX/RX timestamp support.
      Linuxptp 3.1.1 is now installed and the enabled system service
      carbot-mid360-ptp.service runs Jetson as the only software-timestamp PTP
      master on enP8p1s0. A raw UDP probe after lock observed time_type=1 in
      200/200 point-cloud packets and 200/200 IMU packets. A following 1000-sample
      IMU capture had no reversed timestamps; steady receive-minus-device-stamp
      latency had median 0.965 ms and p95 1.335 ms. MID-360-to-Jetson time sync
      passes. ESP32 firmware commit 068071e synchronizes the micro-ROS epoch only
      once when a session is created, then applies one fixed offset to monotonic
      device timestamps. A live 403-sample wheel capture reported
      time_synchronized=true and exact agreement between header and device-time
      increments, but receive-minus-header latency had median 64.84 ms and p95
      74.96 ms. Reanalysis of the earlier 30-minute bag found per-minute median
      latency moving from 8.76 ms through 1.98 ms to 19.01 ms. Periodic resync
      with monotonic output timestamps is therefore required to track ESP clock
      drift and Jetson wall-clock corrections. Fusion remains gated on that
      firmware change, precise IMU extrinsics, and a controlled localization test.
  - id: mid360_origin_and_extrinsics
    state: origin_and_nominal_axes_confirmed_precision_extrinsics_pending
    blocking_calibration: true
    evidence_required: Refine final XY/RPY and the internal IMU lever arm against a mechanical or mapped external reference.
    evidence_observed: >-
      The official Mid-360 mechanical drawing specifies a 60 mm housing height
      and coordinate origin O 47 mm above the housing bottom. Combined with the
      measured 222 mm housing-top height, O is 209 mm above ground and 119 mm
      above base_link. A 12-frame installed point-cloud fit to the wood floor
      independently estimated 206.58 mm with approximately 5.65 mm inlier
      residual standard deviation. The Z baseline is accepted and the URDF,
      livox_frame, front_3d_lidar, and RTX origin now share the 47 mm offset.
      On the final assembly the M12 connector faces the vehicle rear. The
      manufacturer top-view coordinate drawing places the connector on the
      sensor -X side, so sensor +X faces the vehicle front and nominal yaw is
      confirmed as 0 rad (rather than a 90- or 180-degree mounting ambiguity).
      Final XY, sub-degree RPY refinement, and the internal IMU lever arm remain
      pending.
  - id: real_mid360_nvblox_transport
    state: onboard_mapping_and_localization_verified_geometry_pending
    blocking_calibration: false
    evidence_required: Verify sustained TF and nonempty nvblox output with real MID-360 data, then repeat while moving and on the final Jetson-only runtime.
    evidence_observed: >-
      On 2026-09-19 the real-robot workstation environment was aligned with the
      Jetson on Fast DDS. Raw approximately 20k-point, 26-byte PointCloud2 scans
      crossed the 2.4 GHz Wi-Fi link at only about 3.8 Hz and starved TF. A tested
      Jetson relay now publishes rotating stride-4 XYZ-only Sensor Data clouds on
      /mid360/points_xyz: a representative frame was 4992 points, 12 bytes per
      point, 59904 bytes total, at 10.03 Hz. The physical nvblox launch uses
      system time, odom as global frame, livox_frame as pose frame, and measured
      -10 to +55 degree elevation bounds. It produced a nonempty 152 by 56 map at
      0.05 m resolution and approximately 9.83 Hz while odom-to-livox_frame
      remained available. Thirty concurrent pings had zero loss and 36.6 ms mean
      latency. A later Jetson-only moving-map run completed a roughly 0.29 by
      0.30 m closed rectangle. Wheel odometry and LiDAR SLAM agreed on individual
      motion increments, while the final map-to-odom correction of approximately
      -4.6 cm, +1.6 cm, and -14.4 degrees matched the operator-observed accumulated
      track-turning error. The final SLAM pose closed to approximately -6.0 cm,
      -0.9 cm, and -0.8 degrees. PGM/YAML, pose graph, nvblox, and PLY artifacts
      saved successfully and the YAML reloaded through map_server. This validates
      onboard motion transport and first-candidate mapping. The same candidate
      subsequently passed AMCL initialization and guarded Nav2 straight/Spin
      closed-loop tests, followed by a supervised 1.435 m mapping/return route
      with successful saved-map navigation. Precise geometric map truth remains.
  - id: command_watchdog_and_estop
    state: watchdog_and_temporary_manual_cutoff_verified
    blocking_calibration: true
    evidence_required: Physical 500 ms timeout and independent emergency-stop tests.
    evidence_observed: With tracks lifted, first motion occurred about 73 ms after a one-shot 0.05 m/s command and the final tick change occurred about 586 ms after command publication; tracks then remained stopped and explicit zero commands were sent. The vehicle has no standard physical e-stop. During a continuous 0.05 m/s ROS command, the phone web UI red stop did not produce an encoder-observed intermediate stop and motion_blocked remained false. A later trial manually cut ESP32 power about 1.3 s after motion began; ROS telemetry stopped and the operator visually confirmed the tracks stopped. Repowering did not move the tracks; ROS returned with new boot_id 2491872445, active_command_source 0, and zero ticks. This cutoff is accepted only for supervised low-speed calibration with a dedicated operator able to reach it immediately. Final autonomous-navigation acceptance still requires a standard stop that directly interrupts drive power or hardware enable.
  - id: observation_parity
    state: firmware_reflash_30min_no_reconnect_receive_jitter_pending
    blocking_calibration: true
    evidence_required: Compare real observation units, rate, latency, dropout and normalization with training.
    evidence_observed: >-
      Before firmware commit 068071e, runtime Agent checks repeatedly destroyed
      the XRCE session; motion bags contained 3.09-3.46 s gaps and
      reconnect_count increases. After reflashing, Agent cleanup, and disabling
      Jetson Wi-Fi power save, all post-flash motion trials kept reconnect_count
      unchanged. A 1799.39 s static bag then held reconnect_count at 0 with zero
      ping failures: wheel/IMU rates were 49.9919/49.9908 Hz, device-time gaps
      stayed below 61/81 ms, and only about 0.022% of wheel sequence numbers were
      skipped. ROS receive-side gaps nevertheless peaked near 345 ms, with 12
      gaps over 300 ms on each 50 Hz topic, plus six exact duplicate
      samples/timestamps. Firmware session stability passes; receive latency
      jitter and duplicate filtering remain pending.
  - id: real_navigation_acceptance
    state: supervised_1p4m_route_verified_hardware_estop_pending
    blocking_calibration: true
    evidence_required: Manual AMCL initialization and guarded 0.10 m/s short-goal validation.
    evidence_observed: >-
      On 2026-09-19 AMCL initialized at approximately -5.7 cm, -1.1 cm, and
      -1.0 degrees on the first candidate map. A guarded 0.20 m NavigateToPose
      goal completed after approximately 0.106 m because of the configured
      0.10 m goal tolerance; the operator confirmed straight travel and a full
      stop. Dedicated 30 degree Spin goals completed in both directions. Raising
      the final velocity smoother angular follow/brake limits to symmetric
      +/-2.0 rad/s^2 reduced measured stop overshoot from 5--8 degrees to approximately
      2.8/3.9 degrees. All final commands became silent and the Nav2 container
      was stopped. A later integrated mapping route completed 0.501 m, a 90
      degree turn, and 0.300 m and produced a complete larger map bundle. AMCL
      and a roughly 0.55 m return plan succeeded, but NavigateToPose produced no
      observable base motion; controller_server reported Failed to make progress
      after 15 seconds and the bounded client canceled at 30 seconds. An isolated
      diagnostic remapped final output away from the real base and showed both
      controller and smoother stuck at 0.025 rad/s: the former RPP 0.5 rad/s^2
      limit allowed only that increment at 20 Hz, which remained below the
      measured 0.4 rad/s track deadband while zero odometry reset the clamp every
      cycle. Raising RPP's internal max angular acceleration to 10.0 rad/s^2 lets
      it request 0.5 rad/s immediately; the final smoother still ramps at
      +/-2.0 rad/s^2. A second isolated bag showed 0.5 rad/s upstream and a
      0.1-to-0.5 rad/s smoothed ramp, crossing the deadband in about 0.2 seconds.
      Regression tests pass. After a manual relocation, one new integrated route
      mapped 0.501 m, a 90.1 degree turn, and 0.301 m. The corrected controller
      then completed a 0.633 m planned return with SUCCEEDED status; final map
      position and yaw errors were approximately 5.7 cm and 9.6 degrees, within
      configured tolerances, but that goal used the path approach heading rather
      than the approximately 99.0 degree route-start heading. A final dedicated
      82 degree left Spin restored the heading to approximately 99.2 degrees,
      with about 3.4 cm of tracked-turn position drift. The mapping and return
      paths totaled approximately 1.435 m. The container was stopped and cmd_vel
      returned to zero publishers.
      No longer or tiered-distance trial is required. Final release acceptance
      with a standard hardware emergency stop remains pending.

rules:
  - Never replace a pending state with a simulation-only result.
  - Confirmed effective radius and track-separation baselines require real-vehicle acceptance evidence but are not missing-calibration blockers.
  - Feed measured ranges back to the canonical parameter source and domain randomization.
  - Do not tune Nav2 to conceal odometry, TF, actuator, or sensor-calibration errors.
  - Do not freeze or deploy a policy while policy_release_blocked is true.
