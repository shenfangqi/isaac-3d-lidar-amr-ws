schema_version: 1
environment: carbot_goal_navigation

action:
  interface: high_level_twist
  units: physical
  fields: [linear_x_mps, angular_z_rad_s]
  normalized: false
  safety_source: src/carbot_description/config/carbot_parameters.yaml#control
  navigation_limit_source: configs/carbot/real.yaml#velocity_limits
  navigation_acceleration_source: configs/carbot/real.yaml#acceleration_limits
  primary_execution_mode: tracked_joint_velocity
  reserved_execution_modes:
    left_right_track_velocity:
      enabled: false
      enable_after: effective radius and track separation validation
  forbidden_policy_outputs: [pwm, motor_torque]

observations:
  policy_order:
    - goal_pose_body
    - planar_velocity
    - projected_gravity
    - lidar_ranges
    - lidar_valid
    - tof_ranges
    - tof_valid
    - d455_depth
    - d455_valid
    - previous_action
  goal_pose_body_fields: [x_m, y_m, z_m, heading_error_rad]
  planar_velocity_fields: [linear_x_mps, angular_z_rad_s]
  lidar:
    ray_count: 72
    channels: 8
    minimum_range_m: 0.1
    update_period_s: 0.1
    maximum_range_m: 20.0
    horizontal_fov_deg: [-180.0, 180.0]
  tof:
    grid_size: [8, 8]
    sensor_count: 8
    minimum_range_m: 0.02
    maximum_range_m: 4.0
    update_period_s: 0.06666666666666667
  d455:
    width: 32
    height: 24
    horizontal_fov_deg: 87.0
    vertical_fov_deg: 58.0
    # Conservative software operating window, not a claim of hardware Min-Z.
    minimum_range_m: 0.6
    maximum_range_m: 6.0
    update_period_s: 0.03333333333333333
  forbidden_policy_observations:
    - isaac_ground_truth_pose
    - privileged_contact_force
    - simulator_only_object_pose

simulation:
  physics_dt_s: 0.01
  control_decimation: 2
  episode_length_s: 20.0
  num_envs: 64
  env_spacing_m: 16.0
  robot_usd: isaac_sim/usd/carbot.usd
  dynamics_status: TEMP_ESTIMATE_NOT_CALIBRATED

task:
  config: tasks/goal_navigation.yaml
  coupled_to_robot_usd: false

domain_randomization:
  source: src/carbot_description/config/carbot_parameters.yaml#domain_randomization

sim_to_real:
  hardware_calibration_backlog: hardware_calibration_backlog.yaml
  policy_freeze_allowed: false
  reason: Real navigation and kinematic baselines are verified; multi-surface slip, payload dynamics, hardware e-stop and precision sensor extrinsics still block policy release
