# Load only with the experimental launch argument and a physical acceptance profile.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: carbot_recovery_plugins/EvidenceController
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [static_layer, obstacle_layer, inflation_layer, recovery_evidence]
      recovery_evidence:
        plugin: carbot_recovery_plugins/EvidenceLayer
behavior_server:
  ros__parameters:
    behavior_plugins: [bounded_recovery, wait]
    bounded_recovery:
      plugin: carbot_recovery_plugins/BoundedRecovery
      execution_enabled: true
bt_navigator:
  ros__parameters:
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_recovery_node_bt_node
      - carbot_bounded_recovery_bt_node
