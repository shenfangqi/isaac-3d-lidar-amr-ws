schema_version: 1

# This is the canonical parameter source for the Carbot model. Consumers should
# reference these values instead of copying them into URDF, USD, or controllers.
robot:
  drive_type: tracked_differential_skid_steer
  total_working_mass_kg: 1.8

geometry:
  overall_size_m: [0.285, 0.266, 0.240]
  base_link_height_m: 0.090
  physical_track_separation_m: 0.225
  track_width_m: 0.041
  track_thickness_m: 0.004
  effective_track_contact_length_m: 0.145
  footprint_m:
    - [0.155, 0.133]
    - [0.155, -0.133]
    - [-0.130, -0.133]
    - [-0.130, 0.133]
  body_collision:
    size_m: [0.285, 0.266, 0.230]
    position_from_base_link_m: [0.0125, 0.0, 0.035]
  body_visual:
    size_m: [0.220, 0.170, 0.100]
    position_from_base_link_m: [0.0, 0.0, 0.020]
  wheel_groups:
    front_idler:
      x_m: 0.111250
      abs_y_m: 0.112500
      z_m: -0.0419
      radius_m: 0.0210
    front_road_1:
      x_m: 0.067929
      abs_y_m: 0.112500
      z_m: -0.0687
      radius_m: 0.0195
    front_road_2:
      x_m: 0.022929
      abs_y_m: 0.112500
      z_m: -0.0687
      radius_m: 0.0195
    rear_road_1:
      x_m: -0.022071
      abs_y_m: 0.112500
      z_m: -0.0687
      radius_m: 0.0195
    rear_road_2:
      x_m: -0.067071
      abs_y_m: 0.112500
      z_m: -0.0687
      radius_m: 0.0195
    rear_drive:
      x_m: -0.111250
      abs_y_m: 0.112500
      z_m: -0.0419
      radius_m: 0.0210

kinematics:
  effective_track_separation_m: 0.254
  effective_sprocket_radius_m: 0.02175
  encoder_counts_per_revolution: 1560

control:
  max_wheel_rpm: 250.0
  max_wheel_velocity_rad_s: 26.18
  max_linear_velocity_mps: 0.50
  max_angular_velocity_rad_s: 3.50
  max_linear_acceleration_mps2: 0.50
  max_angular_acceleration_rad_s2: 2.50
  cmd_vel_timeout_s: 0.50
  ideal_sim_right_straight_trim: 1.0
  high_fidelity_right_straight_trim: 1.0005
  wheel_pid:
    kp: 0.8
    ki: 0.15
    kd: 0.0
    period_s: 0.01
  differential_period_s: 0.02
  coupled_wheel_limit:
    policy: scale_both_sides_equally
    expression: abs(v) + abs(omega) * effective_track_separation_m / 2 <= effective_sprocket_radius_m * max_wheel_velocity_rad_s

# Physical response evidence from the supervised wood-floor acceptance runs.
# These values describe the present vehicle, not universal safety limits.
hardware_response:
  calibration_status: PARTIAL_PHYSICAL_EVIDENCE
  surface: wood_floor
  added_payload_kg: 0.0
  track_deadband:
    forward_min_sustainable_mps: 0.05
    reverse_min_sustainable_mps: 0.02
    reliable_in_place_angular_command_rad_s: [0.40, 0.50]
  timing:
    first_motion_latency_s: 0.073
    ground_stop_tail_s: [0.57, 0.92]
  observed_motion:
    longitudinal_external_minus_encoder_fraction: [0.0036, 0.0206]
    yaw_external_over_wheel_gain: [0.976, 1.025]
  navigation:
    max_linear_velocity_mps: 0.10
    max_angular_velocity_rad_s: 0.50
    rpp_max_angular_acceleration_rad_s2: 10.0
    smoother_angular_acceleration_rad_s2: 2.0

sensors:
  mid360:
    parent_frame: lidar_link
    real_frame: livox_frame
    simulation_compatibility_frame: front_3d_lidar
    simulation_profile_name: Livox_Mid360_Approx
    coordinate_origin_height_from_housing_bottom_m: 0.047
    simulation_rtx_origin_from_housing_bottom_m: [0.0, 0.0, 0.047]
    mount_translation_xy_from_base_link_m: [-0.003, 0.0]
    housing_top_height_from_ground_m: 0.222
    housing_height_m: 0.060
    rotation_rpy_rad: [0.0, 0.0, 0.0]
    pointcloud_topic: /livox/lidar
    pointcloud_type: sensor_msgs/msg/PointCloud2
    pointcloud_rate_hz: 10
    vendor_imu_topic: /livox/imu
    imu_topic: /mid360/imu/data_raw
    acceleration_input_unit: g
    acceleration_output_unit: m/s^2
    imu_rate_hz: 200
    observed_points_per_frame: [19584, 20448]
    z_origin_requires_final_assembly_verification: false
    visual_proxy:
      radius_m: 0.025

interfaces:
  wheel_ticks:
    topic: /wheel_ticks
    type: carbot_msgs/msg/WheelTicks
    rate_hz: 50
    qos_reliability: best_effort
    forward_tick_sign: positive_both_sides

simulation:
  control_mode: ideal_kinematic_tracked_differential
  articulation_root_prim: /World/Carbot/base_footprint
  wheel_joint_coordinate_sign: -1.0

dynamics:
  calibration_status: TEMP_ESTIMATE_NOT_CALIBRATED
  base_body_mass_kg: 1.68
  per_wheel_mass_kg: 0.01
  center_of_mass_m: [0.0125, 0.0, 0.035]
  inertia_kg_m2:
    ixx: 0.01855
    iyy: 0.02012
    izz: 0.02280
    ixy: 0.0
    ixz: 0.0
    iyz: 0.0
  static_friction: 0.8
  dynamic_friction: 0.6
  restitution: 0.0
  per_side_effort_limit_nm: 0.5
  joint_damping_nm_s_rad: 0.02

sensor_frame_assumptions:
  calibration_status: TEMP_ESTIMATE_NOT_CALIBRATED
  imu_parent_frame: livox_frame
  imu_translation_m: [0.0, 0.0, 0.0]
  imu_rotation_rpy_rad: [0.0, 0.0, 0.0]
  note: imu_link uses the Livox data frame axes; the internal IMU lever arm still requires manufacturer data or dynamic validation.

domain_randomization:
  calibration_status: TEMP_ESTIMATE_NOT_CALIBRATED
  mass_kg: [1.6, 2.0]
  com_offset_m:
    x: [-0.02, 0.02]
    y: [-0.02, 0.02]
    z: [-0.02, 0.02]
  effective_track_separation_m: [0.24, 0.28]
  effective_radius_m: [0.0205, 0.0230]
  friction_scale: [0.6, 1.4]
  actuator_strength_scale: [0.75, 1.25]
  command_latency_s: [0.02, 0.15]
  forward_track_deadband_mps: [0.04, 0.06]
  reverse_track_deadband_mps: [0.015, 0.03]
  longitudinal_gain: [0.97, 1.03]
  yaw_gain: [0.97, 1.03]
  stop_tail_s: [0.5, 1.0]
  point_dropout_fraction: [0.0, 0.05]

# Provenance IDs make measured, source-derived, ground-calibrated, observed,
# design, and temporary values machine-checkable without duplicating values.
provenance:
  MEASURED_VALUE_CARBOT_2026_09_13:
    category: measured_value
    status: confirmed_baseline_with_approximate_wheel_radii
    scope:
      - robot.total_working_mass_kg
      - geometry.overall_size_m
      - geometry.base_link_height_m
      - geometry.physical_track_separation_m
      - geometry.track_width_m
      - geometry.track_thickness_m
      - geometry.effective_track_contact_length_m
      - geometry.footprint_m
      - geometry.body_collision
      - geometry.wheel_groups
    note: Physical dimensions and installed geometry supplied for this adaptation; listed wheel radii are approximate.
  GROUND_CALIBRATED_VALUE_CARBOT_2026_09_13:
    category: ground_calibrated_value
    status: confirmed_baseline
    scope: [kinematics.effective_track_separation_m, kinematics.effective_sprocket_radius_m]
    note: Effective skid-steer values; intentionally distinct from visual geometry.
  SOURCE_CODE_VALUE_CARBOT_CONTROL_2026_09_13:
    category: source_code_value
    status: confirmed_baseline
    scope: [robot.drive_type, kinematics.encoder_counts_per_revolution, control, interfaces.wheel_ticks]
    note: Firmware and controller interface values supplied for this adaptation.
  PHYSICAL_EVIDENCE_CARBOT_2026_09_19:
    category: measured_value
    status: partial_physical_evidence
    scope: [hardware_response]
    note: Supervised wood-floor, zero-added-payload evidence. It constrains the current deployment profile and domain-randomization envelope but does not replace multi-surface or payload calibration.
  MEASURED_VALUE_MID360_MOUNT_2026_09_13:
    category: measured_value
    status: confirmed_baseline
    scope: [sensors.mid360.parent_frame, sensors.mid360.real_frame, sensors.mid360.simulation_compatibility_frame, sensors.mid360.mount_translation_xy_from_base_link_m, sensors.mid360.housing_top_height_from_ground_m, sensors.mid360.rotation_rpy_rad]
    note: Housing top is 0.222 m above ground. On the final assembly the M12 connector faces the vehicle rear; the manufacturer top-view coordinate drawing places the connector on the sensor -X side, so sensor +X faces the vehicle front and nominal yaw is 0 rad. Mount XY and nominal roll/pitch come from the assembly measurements; sub-degree RPY refinement remains a separate calibration item.
  MANUFACTURER_AND_POINTCLOUD_VALUE_MID360_2026_09_18:
    category: manufacturer_specification
    status: confirmed_baseline
    scope: [sensors.mid360.coordinate_origin_height_from_housing_bottom_m, sensors.mid360.simulation_rtx_origin_from_housing_bottom_m, sensors.mid360.housing_height_m, sensors.mid360.z_origin_requires_final_assembly_verification]
    note: The official mechanical drawing gives a 0.060 m housing height and origin O at 0.047 m above the bottom. Together with the measured 0.222 m housing top this predicts O at 0.209 m above ground; an installed point-cloud floor fit measured 0.2066 m, confirming the baseline within about 2.4 mm.
  OBSERVED_VALUE_MID360_2026_09_13:
    category: observed_value
    status: confirmed_baseline
    scope: [sensors.mid360.pointcloud_topic, sensors.mid360.pointcloud_type, sensors.mid360.pointcloud_rate_hz, sensors.mid360.imu_rate_hz, sensors.mid360.observed_points_per_frame]
    note: Topics, rates, and observed real-sensor points-per-frame range.
  SOURCE_CODE_VALUE_MID360_IMU_ADAPTER_2026_09_18:
    category: source_code_value
    status: implemented_design
    scope: [sensors.mid360.vendor_imu_topic, sensors.mid360.imu_topic, sensors.mid360.acceleration_input_unit, sensors.mid360.acceleration_output_unit]
    note: Livox ROS Driver 2 forwards accelerometer values in g; the adapter publishes ROS-compliant acceleration in m/s^2 and marks orientation unavailable.
  DESIGN_VALUE_CARBOT_SIMULATION_2026_09_13:
    category: design_value
    status: implemented_design
    scope: [geometry.body_visual, sensors.mid360.simulation_profile_name, simulation]
    note: Reviewable body proxy, Isaac articulation paths, and coordinate conventions; not hardware calibration values.
  TEMP_ESTIMATE_NOT_CALIBRATED:
    category: temporary_estimate
    status: TEMP_ESTIMATE_NOT_CALIBRATED
    scope: [sensors.mid360.visual_proxy, dynamics, sensor_frame_assumptions, domain_randomization]
    note: Startup simulation assumptions and training ranges, not calibration confidence intervals.
