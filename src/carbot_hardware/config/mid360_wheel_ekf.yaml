ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    # Scale process noise with the estimated planar speed. This prevents the
    # default fixed process noise from inflating pose covariance while parked.
    dynamic_process_noise_covariance: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odometry supplies translation, the non-holonomic lateral-zero
    # constraint, and a low-frequency integrated-yaw anchor. MID-360 gyro-z
    # supplies the independent high-rate turn response.
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, true,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # The MID-360 is the only IMU allowed in the estimator. The raw message has
    # no trusted orientation, so only calibrated base-frame yaw rate is enabled.
    imu0: /mid360/imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 40

    print_diagnostics: true
