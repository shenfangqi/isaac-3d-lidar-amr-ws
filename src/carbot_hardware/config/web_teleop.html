<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Carbot ROS 遥控</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #101827; color: #eef2ff;
      font: 16px system-ui, sans-serif; }
    .page { min-height: 100vh; display: grid; place-items: center;
      padding: 20px; }
    .card { width: min(420px, 100%); text-align: center; }
    .state { min-height: 48px; padding: 12px; border-radius: 12px;
      background: #1f2937; margin: 14px 0; }
    .pad { position: relative; width: 280px; height: 280px;
      margin: 18px auto; }
    button { border: 0; color: white; font-weight: 700; touch-action: none;
      user-select: none; -webkit-user-select: none; }
    .move { position: absolute; width: 82px; height: 82px;
      border-radius: 18px; background: #2563eb; font-size: 28px; }
    .up { top: 0; left: 99px; }
    .down { bottom: 0; left: 99px; }
    .left { left: 0; top: 99px; }
    .right { right: 0; top: 99px; }
    .stop { left: 99px; top: 99px; background: #dc2626; }
    .active { filter: brightness(1.3); outline: 4px solid #93c5fd; }
    .arm { width: 100%; padding: 14px; border-radius: 12px;
      background: #059669; font-size: 17px; }
    .arm.armed { background: #b45309; }
    .hint { color: #a5b4fc; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
<main class="page"><section class="card">
  <h1>Carbot ROS 遥控</h1>
  <div id="state" class="state">正在连接 Jetson…</div>
  <button id="arm" class="arm">使能手动控制</button>
  <div class="pad">
    <button data-linear="0.10" class="move up">▲</button>
    <button data-angular="0.40" class="move left">◀</button>
    <button id="stop" class="move stop">■</button>
    <button data-angular="-0.40" class="move right">▶</button>
    <button data-linear="-0.10" class="move down">▼</button>
  </div>
  <p class="hint">按住运动，松手即停；页面失焦或网络中断会在 0.3 秒内停车。<br>
    网页“停止”不是物理急停。</p>
</section></main>
<script>
  let armed = false;
  let linear = 0;
  let angular = 0;
  let pump = null;
  const state = document.querySelector('#state');
  const arm = document.querySelector('#arm');

  async function post(path, data) {
    const response = await fetch(path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const body = await response.json();
    if (!response.ok) throw Error(body.error || response.statusText);
    return body;
  }

  function command() {
    if (!armed) return;
    post('/api/command', {linear_x: linear, angular_z: angular})
      .catch(error => { state.textContent = error.message; });
  }

  function startPump() {
    command();
    if (!pump) pump = setInterval(command, 100);
  }

  function stopPump() {
    if (pump) { clearInterval(pump); pump = null; }
    linear = 0;
    angular = 0;
    document.querySelectorAll('.active')
      .forEach(element => element.classList.remove('active'));
    command();
  }

  document.querySelectorAll('[data-linear],[data-angular]')
    .forEach(button => {
      button.onpointerdown = event => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        if (button.dataset.linear) linear = Number(button.dataset.linear);
        if (button.dataset.angular) angular = Number(button.dataset.angular);
        button.classList.add('active');
        startPump();
      };
      button.onpointerup = button.onpointercancel =
        button.onlostpointercapture = event => {
          event.preventDefault();
          if (button.dataset.linear) linear = 0;
          if (button.dataset.angular) angular = 0;
          button.classList.remove('active');
          command();
        };
    });

  document.querySelector('#stop').onclick = event => {
    event.preventDefault();
    stopPump();
  };

  arm.onclick = async () => {
    try {
      await post('/api/arm', {enabled: !armed});
      await refresh();
    } catch (error) {
      state.textContent = error.message;
    }
  };

  async function refresh() {
    try {
      const response = await fetch('/api/status', {cache: 'no-store'});
      const status = await response.json();
      armed = status.armed;
      arm.textContent = armed ? '停用手动控制' : '使能手动控制';
      arm.classList.toggle('armed', armed);
      state.textContent = status.error || (armed
        ? '已使能：手机 → /cmd_vel_command → ESP32'
        : '未使能（底盘保持停止）');
    } catch (error) {
      state.textContent = 'Jetson 连接中断';
    }
  }

  function emergencyStop() {
    linear = 0;
    angular = 0;
    if (armed) {
      navigator.sendBeacon(
        '/api/command', JSON.stringify({linear_x: 0, angular_z: 0}));
    }
  }

  addEventListener('blur', stopPump);
  addEventListener('pagehide', emergencyStop);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopPump();
  });
  setInterval(refresh, 500);
  refresh();
</script>
</body>
</html>
