[global]
# MID-360 is the PTP slave. The Jetson is the only master on the isolated
# 192.168.2.0/24 LiDAR link.
domainNumber            0
network_transport       UDPv4
delay_mechanism         E2E
time_stamping           software
masterOnly              1
priority1               1
priority2               1
clockClass              248
clockAccuracy           0xFE
offsetScaledLogVariance 0xFFFF
twoStepFlag             1
logging_level           6
summary_interval        0
uds_address             /run/carbot-mid360-ptp/ptp4l

[enP8p1s0]
