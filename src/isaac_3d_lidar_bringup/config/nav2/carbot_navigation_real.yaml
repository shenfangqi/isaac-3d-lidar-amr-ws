controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      # Closed-loop MID-360/wheel-EKF acceptance repeatedly returned within
      # one degree.  Keep a small margin above that measured result instead
      # of accepting the former 14.3-degree heading error.
      yaw_goal_tolerance: 0.03
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.10
      lookahead_dist: 0.30
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.50
      use_velocity_scaled_lookahead_dist: false
      use_collision_detection: true
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.50
      # RPP clamps against measured odometry on every control cycle.  With the
      # tracked-base deadband, 0.50 rad/s^2 at 20 Hz produced only 0.025 rad/s;
      # odometry stayed at zero and the command could never ramp higher.  Let
      # RPP request the measured 0.50 rad/s turn immediately; the final velocity
      # smoother below still applies the real 2.00 rad/s^2 output ramp.
      max_angular_accel: 10.00

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.155, 0.133], [0.155, -0.133], [-0.130, -0.133], [-0.130, 0.133]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      footprint: "[[0.155, 0.133], [0.155, -0.133], [-0.130, -0.133], [-0.130, 0.133]]"
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    max_rotational_vel: 0.50
    min_rotational_vel: 0.40
    rotational_acc_lim: 0.50
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.10, 0.0, 0.50]
    min_velocity: [-0.10, 0.0, -0.50]
    # RPP requests a turn above the measured track deadband; this final smoother
    # supplies the physical launch/brake ramp.  Its former 0.50 rad/s^2 limit
    # added 5--8 degrees after Spin had already succeeded.  Symmetric limits
    # also avoid direction-dependent braking because returning from negative
    # angular velocity uses max_accel.
    max_accel: [0.20, 0.0, 2.00]
    max_decel: [-0.20, 0.0, -2.00]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
