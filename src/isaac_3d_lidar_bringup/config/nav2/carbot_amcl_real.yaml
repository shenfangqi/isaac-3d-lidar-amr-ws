map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    tf_broadcast: true
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.10
    # Do not scan-match stationary sensor noise. Zero thresholds let repeated
    # MID-360 scans pull AMCL into a similar-looking table-leg arrangement
    # while odometry was stationary. The controller now operates in map, so
    # it no longer needs a new AMCL correction on every scan for FollowPath.
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 2
    laser_model_type: likelihood_field_prob
    laser_min_range: 0.5
    laser_max_range: 20.0
    max_beams: 180
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.20
    z_hit: 0.80
    z_rand: 0.20
    z_max: 0.0
    z_short: 0.0
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    min_particles: 800
    max_particles: 3000
    pf_err: 0.03
    pf_z: 0.99
    # Post-date map->odom beyond the longest measured scan/update gap. Odom
    # still supplies current base motion; this extends the AMCL correction's
    # validity so the controller does not request a transform in the future.
    transform_tolerance: 1.5
