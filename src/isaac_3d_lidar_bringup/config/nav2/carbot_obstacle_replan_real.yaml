# Issue #1: loaded on top of carbot_navigation_real.yaml only with the launch
# argument obstacle_replan:=true.  The launch file also sets
# bt_navigator.default_nav_to_pose_bt_xml to the installed
# navigate_to_pose_replan_after_controller_failure_real.xml.
#
# The local costmap is unchanged and keeps the raw /scan for stopping.  The
# global costmap sees only persistent novel obstacles: static-map returns are
# removed by static_map_scan_filter and a five-frame temporal median follows.
# Its obstacles matter only when the controller has failed twice and the tree
# computes its single detour, so a transient global mark no longer cancels a
# valid route as it did under IsPathValid.
global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        enabled: true
        scan:
          topic: /scan_global_filtered

static_map_scan_filter:
  ros__parameters:
    use_sim_time: false
    input_topic: /scan
    output_topic: /scan_global_static_filtered
    map_topic: /map
    map_frame: map
    # Simulation starting values; re-accept against the real MID-360, AMCL
    # jitter and motion distortion before enabling by default.
    static_margin_m: 0.12
    occupied_threshold: 65
    # The real AMCL/FAST-LIO chain has measured 0.2-0.7 s transform bursts.
    # A scan that misses this window is dropped from the global branch only.
    transform_timeout_sec: 0.2

global_scan_filter:
  ros__parameters:
    use_sim_time: false
    filter1:
      name: temporal_median_5
      type: laser_filters/LaserArrayFilter
      params:
        range_filter_chain:
          filter1:
            name: median_5
            type: filters/MultiChannelMedianFilterFloat
            params:
              number_of_observations: 5
              unused: 10
        intensity_filter_chain:
          filter1:
            name: median_5
            type: filters/MultiChannelMedianFilterFloat
            params:
              number_of_observations: 5
              unused: 10
