# Issue #1 detour. Off by default on the robot; novel_obstacle_detour:=true
# enables it for operator-supervised tests.
# Loaded on top of carbot_navigation_real.yaml together with
# behavior_trees/navigate_to_pose_detour_real.xml and the
# novel_obstacle_keepoff node.
#
# The native global obstacle layer stays disabled.  Novel obstacles reach the
# planner only through the keep-off grid: the saved map republished with
# confirmed novel returns, an assumed depth behind them and a lethal
# keep-off around them.  The second StaticLayer overwrites the master grid
# with it (the default).  Humble's use_maximum is costmap-wide: enabling it
# stops the first StaticLayer from writing the map's unknown cells, which then
# read as free.  Until the node publishes, the second layer has no map, the
# global costmap is not current and the planner waits indefinitely: start the
# node with Nav2.  The local costmap is unchanged.
#
# Depth and keep-off were 0.4 m and 0.5 m while nothing saw inside 0.5 m.
# With /scan_near (0.1-0.6 m) in the local costmap and reverse_escape
# backing the robot off before a detour, they are 0.2 m and 0.3 m: on
# 2026-10-18 a box with 0.8 m to the wall was planned around as a closed
# corridor, because 0.4 m depth plus 0.5 m keep-off reached the wall.
#
# Issue #123: the detour tree checks the route ahead with IsPathValid, which
# the planner answers against this costmap.  With a footprint it tests the
# polygon at each pose's yaw, and Smac2D leaves every yaw at 0, so a route
# Smac2D placed beside a wall could fail on the wall.  With a radius it
# fails only where the path centre is lethal or inscribed, cells Smac2D
# never plans through.  The radius is the polygon's inscribed radius (rear
# edge 0.130 m), so the inflation costs are unchanged, and Smac2D checks
# only the centre cost either way: planning is unchanged.  The controller's
# local costmap keeps the polygon.
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[]"
      robot_radius: 0.130
      plugins: [static_layer, novel_keepoff_layer, obstacle_layer, inflation_layer]
      novel_keepoff_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /novel_obstacle_keepoff
        map_subscribe_transient_local: true
        subscribe_to_updates: false

novel_obstacle_keepoff:
  ros__parameters:
    marking_scan_topic: /scan_global_filtered
    clearing_scan_topic: /scan
    map_topic: /map
    output_topic: /novel_obstacle_keepoff
    assumed_depth_m: 0.2
    keepoff_radius_m: 0.3
    robot_clear_radius_m: 0.3
    confirm_hits: 3
    mark_max_range_m: 4.0
    publish_rate_hz: 2.0
