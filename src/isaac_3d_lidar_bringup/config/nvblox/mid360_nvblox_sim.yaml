/**:
  ros__parameters:
    # Isaac renders partial RTX scans at approximately 30 Hz even though the
    # proxy rotates at 10 Hz. Consume all three partial clouds per revolution.
    integrate_lidar_rate_hz: 30.0
    # Reject Carter chassis returns while retaining the Mid-360 minimum range
    # in the base profile for real-hardware configuration.
    lidar_min_valid_range_m: 0.5
    input_qos: "DEFAULT"
    map_clearing_radius_m: 15.0
    map_clearing_frame_id: "odom"
    esdf_slice_bounds_visualization_attachment_frame_id: "odom"
    layer_visualization_exclusion_radius_m: 15.0

    static_mapper:
      lidar_projective_integrator_max_integration_distance_m: 10.0
      esdf_slice_height: 0.09
      esdf_slice_min_height: 0.09
      esdf_slice_max_height: 0.65
      layer_streamer_exclusion_radius_m: 15.0

    dynamic_mapper:
      esdf_slice_height: 0.09
      esdf_slice_min_height: 0.09
      esdf_slice_max_height: 0.65
