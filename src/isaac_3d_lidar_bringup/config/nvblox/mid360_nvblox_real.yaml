/**:
  ros__parameters:
    # The physical MID-360 publishes one complete revolution at 10 Hz.
    integrate_lidar_rate_hz: 10.0
    # Reject the sensor mount and the nearest parts of the chassis.
    lidar_min_valid_range_m: 0.5
    # Real returns extend slightly beyond the nominal -7 to +52 degree
    # mechanical FoV. nvblox rejects the entire LiDAR model when even one
    # valid point lies outside these bounds, so retain a measured margin.
    min_angle_below_zero_elevation_rad: 0.174532925
    max_angle_above_zero_elevation_rad: 0.959931089
    # Best-effort avoids reliable RTPS retransmission stalls on the Wi-Fi hop.
    input_qos: "SENSOR_DATA"

    # Keep rolling-map maintenance centred on the moving robot, while the
    # reconstructed map itself remains fixed in odom.
    map_clearing_radius_m: 7.0
    map_clearing_frame_id: "base_footprint"
    esdf_slice_bounds_visualization_attachment_frame_id: "base_footprint"
    workspace_height_bounds_visualization_attachment_frame_id: "base_footprint"
    layer_visualization_exclusion_radius_m: 0.5

    static_mapper:
      lidar_projective_integrator_max_integration_distance_m: 10.0
      esdf_slice_height: 0.09
      esdf_slice_min_height: 0.09
      # Match the 0.35 m autonomous overhead-clearance threshold.
      esdf_slice_max_height: 0.35
      layer_streamer_exclusion_radius_m: 0.5
